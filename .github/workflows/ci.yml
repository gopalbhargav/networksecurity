
name: Network Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets are not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env is tracked by Git."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m compileall -q app.py main.py networksecurity tests

      - name: Run automated tests
        run: |
          pytest -q

      - name: Build Docker image
        run: |
          docker build -t network-security-mlops:ci .

      - name: Smoke test Docker container
        shell: bash
        run: |
          set -e
          docker run -d --name network-security-ci -p 8000:8000 \
            network-security-mlops:ci

          cleanup() {
            docker logs network-security-ci || true
            docker rm -f network-security-ci || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Container health endpoint failed."
          exit 1
